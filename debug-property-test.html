<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Creation Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 10px 0; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ConnectSpace Property Creation Debug</h1>
    
    <div>
        <h3>1. Test Backend Connection</h3>
        <button onclick="testBackend()">Test Backend Health</button>
        <div id="backendResult" class="log"></div>
    </div>

    <div>
        <h3>2. Test Authentication</h3>
        <label>Email:</label>
        <input type="email" id="email" placeholder="your.email@example.com">
        <label>Password:</label>
        <input type="password" id="password" placeholder="your password">
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult" class="log"></div>
    </div>

    <div>
        <h3>3. Test Property Creation</h3>
        <label>Property Title:</label>
        <input type="text" id="propertyTitle" value="Test Property" placeholder="Property Title">
        <label>Description:</label>
        <textarea id="propertyDescription" placeholder="Property Description">A test property for debugging</textarea>
        <label>City:</label>
        <input type="text" id="propertyCity" value="Mumbai" placeholder="City">
        <label>Address:</label>
        <input type="text" id="propertyAddress" value="123 Test Street" placeholder="Address">
        <label>Price:</label>
        <input type="number" id="propertyPrice" value="25000" placeholder="Monthly Rent">
        <button onclick="testPropertyCreation()">Test Property Creation</button>
        <div id="propertyResult" class="log"></div>
    </div>

    <script>
        const API_BASE = 'https://connectspace-abgg.onrender.com/api';
        let authToken = localStorage.getItem('authToken');

        function log(elementId, message, isError = false, isSuccess = false) {
            const element = document.getElementById(elementId);
            const className = isError ? 'log error' : (isSuccess ? 'log success' : 'log');
            element.innerHTML = `<div class="${className}">${new Date().toLocaleTimeString()}: ${message}</div>` + element.innerHTML;
        }

        async function testBackend() {
            try {
                log('backendResult', 'Testing backend connection...', false, false);
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                log('backendResult', `✅ Backend is running: ${JSON.stringify(data, null, 2)}`, false, true);
            } catch (error) {
                log('backendResult', `❌ Backend connection failed: ${error.message}`, true);
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                log('loginResult', '❌ Please enter email and password', true);
                return;
            }

            try {
                log('loginResult', 'Attempting login...', false, false);
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    authToken = data.data.token;
                    localStorage.setItem('authToken', authToken);
                    log('loginResult', `✅ Login successful! Token: ${authToken.substring(0, 20)}...`, false, true);
                } else {
                    log('loginResult', `❌ Login failed: ${data.message || 'Unknown error'}`, true);
                }
            } catch (error) {
                log('loginResult', `❌ Login error: ${error.message}`, true);
            }
        }

        async function testPropertyCreation() {
            if (!authToken) {
                log('propertyResult', '❌ Please login first to get auth token', true);
                return;
            }

            const propertyData = {
                title: document.getElementById('propertyTitle').value,
                description: document.getElementById('propertyDescription').value,
                propertyType: 'office',
                category: 'commercial',
                address: {
                    street: document.getElementById('propertyAddress').value,
                    area: document.getElementById('propertyCity').value,
                    city: document.getElementById('propertyCity').value,
                    state: 'Maharashtra',
                    pincode: '400001',
                    country: 'India',
                    landmark: ''
                },
                rental: {
                    monthlyRent: parseInt(document.getElementById('propertyPrice').value) || 25000,
                    securityDeposit: 50000,
                    maintenanceCharges: 2000,
                    utilitiesIncluded: false
                },
                specifications: {
                    totalArea: 1000,
                    builtUpArea: 900,
                    floorNumber: 3,
                    totalFloors: 10,
                    bedrooms: 0,
                    bathrooms: 1,
                    amenities: ['parking', 'security']
                },
                images: [],
                visibility: 'public',
                status: 'available'
            };

            try {
                log('propertyResult', 'Creating property...', false, false);
                log('propertyResult', `Property data: ${JSON.stringify(propertyData, null, 2)}`, false, false);
                
                const response = await fetch(`${API_BASE}/properties`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(propertyData)
                });

                const data = await response.json();
                
                log('propertyResult', `Response status: ${response.status}`, false, false);
                log('propertyResult', `Response data: ${JSON.stringify(data, null, 2)}`, false, false);
                
                if (response.ok && data.success) {
                    log('propertyResult', `✅ Property created successfully! ID: ${data.data.property._id}`, false, true);
                } else {
                    log('propertyResult', `❌ Property creation failed: ${data.message || 'Unknown error'}`, true);
                    if (data.errors) {
                        log('propertyResult', `Validation errors: ${JSON.stringify(data.errors, null, 2)}`, true);
                    }
                }
            } catch (error) {
                log('propertyResult', `❌ Property creation error: ${error.message}`, true);
            }
        }

        // Auto-test backend on load
        window.onload = () => {
            testBackend();
            // Pre-fill with test credentials if available
            const testEmail = 'landlord@test.com';
            document.getElementById('email').value = testEmail;
        };
    </script>
</body>
</html>
